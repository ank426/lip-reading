[project]
name = "lipreading"
version = "0.2.0"
description = "Visual speech recognition: MobileNetV2 frame encoder with a bidirectional GRU classifier."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
keywords = ["lip-reading", "visual-speech-recognition", "deep-learning", "pytorch"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "torch>=2.4",
    "torchvision>=0.19",
    "opencv-python>=4.9",
    "numpy>=1.26",
    "matplotlib>=3.8",
    "seaborn>=0.13",
    "scikit-learn>=1.4",
    "tqdm>=4.66",
]

[project.scripts]
lipreading-train = "lipreading.train:main"
lipreading-predict = "lipreading.predict:main"

[project.urls]
Repository = "https://github.com/ank426/lip-reading"
Issues = "https://github.com/ank426/lip-reading/issues"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-cov>=5.0",
    "ruff>=0.8",
    "ty>=0.0.84",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/lipreading"]

[tool.ruff]
line-length = 110
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["A", "B", "BLE", "C4", "E", "F", "I", "N", "PL", "PTH", "RET", "RUF", "SIM", "TID", "UP", "W"]
ignore = ["E501", "PLR0913"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["PLR2004", "S101"]

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = "-ra --strict-markers"
filterwarnings = ["ignore::DeprecationWarning:torch.*"]

[tool.ty.src]
include = ["src", "tests"]

[tool.ty.environment]
python-version = "3.11"

[tool.ty.rules]
possibly-unresolved-reference = "warn"
